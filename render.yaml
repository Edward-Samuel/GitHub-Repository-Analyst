services:
  - type: web
    name: repochat-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PRIMARY_MODEL
        value: gemma-4-26b-a4b-it
      - key: FALLBACK_MODEL
        value: gemma-4-31b-it
